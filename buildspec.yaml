version: 0.2

phases:
  install:
    runtime-versions:
      docker: 18
    commands:
      - echo Installing dependencies...
      - apt-get update && apt-get install -y jq

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 897729119415.dkr.ecr.us-east-1.amazonaws.com
      
      - echo Retrieving Docker Hub credentials from Secrets Manager...
      - >
        export DOCKERHUB_SECRET=$(aws secretsmanager get-secret-value --secret-id dockerhub/credentials --query SecretString --output text)
      - export DOCKERHUB_USERNAME=$(echo $DOCKERHUB_SECRET | jq -r .username)
      - export DOCKERHUB_PASSWORD=$(echo $DOCKERHUB_SECRET | jq -r .password)

      - echo Logging in to Docker Hub...
      - echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build --no-cache -t donthi-ecs-repo .
      - docker tag donthi-ecs-repo:latest 897729119415.dkr.ecr.us-east-1.amazonaws.com/donthi-ecs-repo:latest

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing Docker image to ECR...
      - docker push 897729119415.dkr.ecr.us-east-1.amazonaws.com/donthi-ecs-repo:latest
      - echo Creating imagedefinitions.json...
      - >
        printf '[{"name":"donthi-flask-app","imageUri":"%s"}]'
        897729119415.dkr.ecr.us-east-1.amazonaws.com/donthi-ecs-repo:latest > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
