AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate Infra with Load Balancer, VPC, and Private Networking for donthi

Parameters:
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.2.0/24

  ContainerPort:
    Type: Number
    Default: 5000

Resources:

  # VPC
  DonthiVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      Tags:
        - Key: Name
          Value: donthi-vpc

  # Subnets
  DonthiPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DonthiVPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: donthi-public-subnet-1

  DonthiPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DonthiVPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: donthi-private-subnet-1

  # Internet Gateway
  DonthiInternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DonthiVPC
      InternetGatewayId: !Ref DonthiInternetGateway

  # Route Table and Route
  DonthiPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DonthiVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref DonthiPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DonthiInternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DonthiPublicSubnet1
      RouteTableId: !Ref DonthiPublicRouteTable

  # Security Groups
  DonthiALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to ALB
      VpcId: !Ref DonthiVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  DonthiECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow from ALB
      VpcId: !Ref DonthiVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref DonthiALBSecurityGroup

  # IAM Role for ECS Task Execution
  DonthiTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  # ECS Cluster
  DonthiECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: donthi-ecs-cluster

  # Load Balancer
  DonthiALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: donthi-alb
      Subnets:
        - !Ref DonthiPublicSubnet1
      SecurityGroups:
        - !Ref DonthiALBSecurityGroup
      Scheme: internet-facing
      Type: application

  DonthiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !Ref DonthiVPC
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200

  DonthiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DonthiTargetGroup
      LoadBalancerArn: !Ref DonthiALB
      Port: 80
      Protocol: HTTP

  # Task Definition
  DonthiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: donthi-task
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt DonthiTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: donthi-app
          Image: 897729119415.dkr.ecr.us-east-1.amazonaws.com/donthi-ecs-repo:latest
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/donthi-task
              awslogs-region: us-east-1
              awslogs-stream-prefix: ecs

  # ECS Service
  DonthiECSService:
    Type: AWS::ECS::Service
    DependsOn: DonthiListener
    Properties:
      Cluster: !Ref DonthiECSCluster
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref DonthiTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref DonthiPrivateSubnet1
          SecurityGroups:
            - !Ref DonthiECSSecurityGroup
      LoadBalancers:
        - ContainerName: donthi-app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref DonthiTargetGroup

Outputs:
  LoadBalancerDNS:
    Description: Public DNS of the ALB
    Value: !GetAtt DonthiALB.DNSName

  ECSClusterName:
    Value: !Ref DonthiECSCluster

  ECSTaskExecutionRole:
    Value: !Ref DonthiTaskExecutionRole
